name: npm package

# Builds the npm package spec-ai-agent (kyrn/npm/build.mjs), then installs the tarball on Linux, macOS and Windows
# and checks that the installed `mu` runs and loads the judgment layer (kyrn/npm/smoke.mjs). No model is called.
#
# On a `spec-ai-agent-v*` tag the `publish` job publishes that same tested tarball with npm trusted publishing
# (OIDC, no stored token) and `--provenance`, then checks the attestation the registry reports. Nothing is
# published from a branch: a version that users get has been installed and run first.
on:
  push:
    branches: [main]
    paths:
      - 'kyrn/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/npm.yml'
    tags:
      - 'spec-ai-agent-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build pi
        run: npm run build

      - name: Build and pack spec-ai-agent
        run: node kyrn/npm/build.mjs --pack

      - name: List the tarball
        run: |
          cd .artifacts/npm
          tar -tzf spec-ai-agent-*.tgz | sort > spec-ai-agent-files.txt
          wc -l < spec-ai-agent-files.txt
          sed -E 's#^package/##; s#/.*##' spec-ai-agent-files.txt | sort | uniq -c
          ls -l spec-ai-agent-*.tgz

      - name: Upload the tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spec-ai-agent-tarball
          path: |
            .artifacts/npm/spec-ai-agent-*.tgz
            .artifacts/npm/spec-ai-agent-files.txt
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Install and run on ${{ matrix.name }}
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Node mu supports, and the current one.
          - { name: Linux (Node 22.19), os: ubuntu-latest, node: '22.19.0' }
          - { name: macOS, os: macos-14, node: '24' }
          - { name: Windows, os: windows-2022, node: '24' }
          - { name: Windows on Arm, os: windows-11-arm, node: '24' }
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: kyrn/npm

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Download the tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spec-ai-agent-tarball
          path: tarball

      # A prefix of its own, as `npm i -g` would use, without touching the runner's global packages.
      - name: Install
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/mu-prefix"
          npm i -g --prefix "$prefix" ./tarball/spec-ai-agent-*.tgz
          if [ "$RUNNER_OS" = "Windows" ]; then echo "$prefix" >> "$GITHUB_PATH"; else echo "$prefix/bin" >> "$GITHUB_PATH"; fi

      - name: Smoke test
        shell: bash
        run: node kyrn/npm/smoke.mjs mu

  # Trusted publishing: npm exchanges this job's OIDC identity for the right to publish, so no token is stored
  # anywhere, and `--provenance` makes the registry publish an attestation that says which commit and which
  # workflow built the tarball. Only a tag reaches this job, and only the tarball the jobs above installed and
  # ran is published — never a fresh build.
  publish:
    name: Publish spec-ai-agent
    if: startsWith(github.ref, 'refs/tags/spec-ai-agent-v')
    needs: [pack, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the OIDC identity npm trusted publishing checks
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Download the tested tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spec-ai-agent-tarball
          path: tarball

      - name: Check the tag matches the tarball's version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#spec-ai-agent-v}"
          packed="$(ls tarball/spec-ai-agent-*.tgz)"
          case "$packed" in
            *"spec-ai-agent-$tag.tgz") echo "tag $tag matches $packed" ;;
            *) echo "::error::tag $tag does not match the packed $packed"; exit 1 ;;
          esac

      - name: Publish with provenance
        shell: bash
        run: npm publish ./tarball/spec-ai-agent-*.tgz --provenance --access public

      - name: Verify the registry recorded an attestation
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#spec-ai-agent-v}"
          attempts=0
          until npm view "spec-ai-agent@$tag" dist.attestations --json | grep -q '"url"'; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 12 ]; then echo "::error::no attestation for spec-ai-agent@$tag"; exit 1; fi
            sleep 10
          done
          npm view "spec-ai-agent@$tag" dist.integrity dist.attestations --json
