name: Preflight

# One command, on the machine where it is supposed to pass.
#
# `scripts/preflight.mjs --fast` runs the gates a release needs that need no credential: the repository check, the
# script tests, the kernel and model-layer suites, and the task benchmark's self-check. On a developer's machine the
# kernel step can stop for reasons that have nothing to do with the change (no Chrome, a sandbox that withholds
# permissions); here, on a runner with what those tests want, the command is the whole gate.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight · the gates a release needs, without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (the checks read the build)
        run: npm run build

      - name: Preflight
        run: node scripts/preflight.mjs --fast
