name: desktop package

# One job, Windows x64: that is the artifact this product ships today, the installer the install rehearsal runs, and the
# feed the updater reads. macOS and Linux targets are configured in electron-builder.yml but are not built here yet;
# they need their own signing secrets rather than a matrix that pretends one certificate signs all three.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # electron-builder reads these itself; empty secrets simply mean an unsigned build. The installer still works,
      # and Windows SmartScreen will say who signed it (nobody).
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: verify
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run budget

      - name: build the runtime from source
        shell: pwsh
        run: |
          # The runtime source is vendored at spec.ai.jev/. Its build puts a package under .artifacts/npm, and the
          # desktop stages that: no package from npm, no path outside the repository.
          Push-Location spec.ai.jev
          npm ci
          npm run build
          node kyrn/npm/build.mjs
          Pop-Location
          npm install --omit=dev --prefix spec.ai.jev/.artifacts/npm/spec-ai-agent
          "SPEC_AI_JEV_HARNESS_ROOT=$PWD/spec.ai.jev/.artifacts/npm" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: package
        run: npm run package
        env:
          # Compiled into the main process (electron.vite.config.mts). Empty means this build can report updates and
          # cannot install them, which is the safe default; set the secret to turn installation on.
          SPEC_UPDATE_PUBLIC_KEY: ${{ secrets.SPEC_UPDATE_PUBLIC_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: spec.ai.jev-0.1.0-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      # A draft, not a release: the bytes a tag produces are the bytes someone has to install and the updater has to
      # prove, and publishing is a person's decision (see docs/release.md).
      - name: draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
